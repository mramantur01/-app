# Builds a debug APK of KG Taxi and runs unit tests on every push and pull request.
# The APK appears under the run's "Artifacts" section on GitHub (Actions tab).
#
# Optional repository secrets (Settings → Secrets and variables → Actions):
#   GOOGLE_SERVICES_JSON  – contents of app/google-services.json from the Firebase console.
#                           Without it the app builds, but sign-in and cloud sync won't work.
#   MAPS_API_KEY          – Google Maps key. Without it the built-in vector map is used.
name: Android build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      # The GitHub Ubuntu runner already has the Android SDK (ANDROID_HOME) with licenses accepted;
      # missing platforms are downloaded by the Android Gradle plugin.
      - name: Show Android SDK
        run: echo "ANDROID_HOME=$ANDROID_HOME" && ls "$ANDROID_HOME/platforms" || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # Firebase (Google sign-in, phone sign-in) only trusts an app signed with a key whose
      # SHA fingerprints are registered in the Firebase console. So the key must be the SAME
      # in every build: it is kept in the DEBUG_KEYSTORE_BASE64 secret.
      # If the secret is missing, a new key is made and offered as the "debug-keystore" artifact.
      - name: Debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
            echo "Using the stable debug key from secrets"
          else
            keytool -genkeypair -v -keystore debug.keystore -storepass android \
              -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            mkdir -p keystore-out && cp debug.keystore keystore-out/
            echo "::warning title=signing::DEBUG_KEYSTORE_BASE64 secret not set — a NEW key was made. Save it from the 'debug-keystore' artifact."
          fi
          # Fingerprints are public (not secret). Firebase needs them.
          SHA1=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -m1 'SHA1:' | sed 's/.*SHA1: //')
          SHA256=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -m1 'SHA256:' | sed 's/.*SHA256: //')
          echo "::notice title=SHA-1::$SHA1"
          echo "::notice title=SHA-256::$SHA256"

      - uses: actions/upload-artifact@v4
        with:
          name: debug-keystore
          path: keystore-out/debug.keystore
          if-no-files-found: ignore

      - name: Write google-services.json (if provided)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
            echo "google-services.json written"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set — using a placeholder. Sign-in and cloud sync will NOT work in this APK."
            cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "kgtaxi-placeholder",
              "storage_bucket": "kgtaxi-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": { "package_name": "com.kgtaxi.app" }
                },
                "oauth_client": [
                  { "client_id": "000000000000-placeholder.apps.googleusercontent.com", "client_type": 3 }
                ],
                "api_key": [ { "current_key": "placeholder-not-a-real-key" } ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      { "client_id": "000000000000-placeholder.apps.googleusercontent.com", "client_type": 3 }
                    ]
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON
          fi

      - name: Write .env (if provided)
        env:
          MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
        run: |
          if [ -n "$MAPS_API_KEY" ]; then
            echo "MAPS_API_KEY=$MAPS_API_KEY" > .env
          fi

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Unit tests
        run: |
          set -o pipefail
          gradle testDebugUnitTest 2>&1 | tee test.log

      # Turn the key error lines into annotations, visible on the run page without opening logs.
      - name: Report errors
        if: failure()
        run: |
          for f in build.log test.log; do
            [ -f "$f" ] || continue
            grep -E '^e: |What went wrong|> .*(failed|Could not|not found|Unresolved)|FAILED$|Exception' "$f" \
              | grep -v '^\s*at ' | head -n 25 | while IFS= read -r line; do
                echo "::error title=$f::${line:0:900}"
              done
            awk '/What went wrong/{p=1} p{print; n++} n>12{exit}' "$f" | tr '\n' ' ' | cut -c1-1500 \
              | sed 's/^/::error title=what-went-wrong::/'
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kg-taxi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
